# The project's name, pinned: compose otherwise names it after the checkout's directory, so
# a git worktree's scripts would look for a project of their own and find no Postgres.
name: grit

services:
  postgres:
    # postgres:18 plus pg_textsearch, built from docker/postgres/Dockerfile. The tag names
    # what is in it; bump it with the Dockerfile's versions. The live tests build the same
    # Dockerfile (build.mill's LivePostgres), so the two run one image.
    image: grit-postgres:18-pg_textsearch-1.4.0
    build: docker/postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: grit
      POSTGRES_PASSWORD: grit
      POSTGRES_DB: grit
    ports:
      - "5432:5432"   # free; app connects on 5432
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data: