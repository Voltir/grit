# grit's architecture law, checked by `bash scripts/enola-law.sh`.
#
# It enforces these things:
#   1. Only grit.dbos may import dev.dbos.*, JDBC or the Postgres driver, only
#      grit.models and grit.mcp the JDK HTTP client, only grit.slack the Slack SDK, and only
#      grit.host may start a process (STYLE rule 8); grit.slack names core and prose alone
#   2. grit.tui's four groups import in one direction (grit/tui/CLAUDE.md)
#   3. grit.prose names no other grit module (grit/prose/README.md)
#   4. core names no extension, each extension names core alone, and the kit names no edge
#      extension, terminal UI or deployment (ADR 0021; grit/kit/README.md)
#
# Every rule was watched failing on a deliberately planted bad import before it was
# adopted. Do the same for any new rule: a rule that can't fail passes silently.
# The evidence for each choice below is in roadmap/decisions.md (2026-09-23 rows).

service:
  name: grit
  description: LLM coding harness whose prompt is a computed projection over Postgres

# No `layers:` block, on purpose. Between Mill modules, Mill already rejects both cycles and
# undeclared imports. Inside tui, the strict rules below are stricter than a layer order
# can be. A layer violation is only ever an advisory, so it would repeat a failure that is
# already reported.

# ---------------------------------------------------------------------------------------
# Components: named sets of code that the rules refer to. Paths start at the repo root.
# ---------------------------------------------------------------------------------------
components:
  # Every module except grit.dbos. For most of them these rules duplicate a compile error
  # (no DBOS on their classpath). grit.kit, grit.app and grit.eval are the exceptions: they depend on
  # grit.dbos, and Mill's moduleDeps are transitive, so these rules are the only guard there.
  - name: outside-dbos
    kind: dependency
    match: ["grit/core/**", "grit/tui/**", "grit/turn/**", "grit/models/**", "grit/assembly/**", "grit/kit/**", "grit/app/**", "grit/eval/**", "grit/prose/**", "grit/host/**", "grit/tools/**", "grit/lifecycle/**", "grit/digest/**", "grit/edge/**", "grit/slack/**", "grit/mcp/**"]

  # Every module except grit.models and grit.mcp, the two egresses, for the HTTP quarantine
  # (STYLE rule 8).
  - name: outside-egress
    kind: dependency
    match: ["grit/core/**", "grit/tui/**", "grit/turn/**", "grit/dbos/**", "grit/assembly/**", "grit/kit/**", "grit/app/**", "grit/eval/**", "grit/prose/**", "grit/host/**", "grit/tools/**", "grit/lifecycle/**", "grit/digest/**", "grit/edge/**", "grit/slack/**"]

  # Every module except grit.host, for the process quarantine (STYLE rule 8).
  - name: outside-host
    kind: dependency
    match: ["grit/core/**", "grit/tui/**", "grit/turn/**", "grit/dbos/**", "grit/models/**", "grit/assembly/**", "grit/kit/**", "grit/app/**", "grit/eval/**", "grit/prose/**", "grit/tools/**", "grit/lifecycle/**", "grit/digest/**", "grit/edge/**", "grit/slack/**", "grit/mcp/**"]

  # Every module except grit.slack, for the Slack SDK's quarantine (STYLE rule 8).
  - name: outside-slack
    kind: dependency
    match: ["grit/core/**", "grit/tui/**", "grit/turn/**", "grit/dbos/**", "grit/models/**", "grit/assembly/**", "grit/kit/**", "grit/app/**", "grit/eval/**", "grit/prose/**", "grit/host/**", "grit/tools/**", "grit/lifecycle/**", "grit/digest/**", "grit/edge/**", "grit/mcp/**"]

  # grit.slack's sources, for its rule below: an edge names core and prose, never the turn.
  - {name: slack-code,     kind: module, match: ["grit/slack/src", "grit/slack/src/**"]}

  # The tui groups, for the direction rules. `runtime` needs no entry: it may import
  # every group.
  - {name: core-code,      kind: module, match: ["grit/core/src", "grit/core/src/**"]}
  - {name: tui-model,      kind: module, match: ["grit/tui/src/model", "grit/tui/src/model/**"]}
  - {name: tui-components, kind: module, match: ["grit/tui/src/components", "grit/tui/src/components/**"]}
  - {name: tui-wire,       kind: module, match: ["grit/tui/src/wire", "grit/tui/src/wire/**"]}

  # grit.prose, for its rule below: the source tree alone, so a test's imports are not
  # counted against it.
  - {name: prose-code,     kind: module, match: ["grit/prose/src", "grit/prose/src/**"]}

  # Core, extension, kit and deployment (ADR 0021; the table is grit/kit/README.md's), for
  # rule 4 below. Source trees alone, so a test's imports are not counted. Which core module
  # may name which is Mill's moduleDeps' job, not these rules'.
  - name: core-modules
    kind: module
    match: ["grit/core/src", "grit/core/src/**", "grit/dbos/src", "grit/dbos/src/**",
            "grit/turn/src", "grit/turn/src/**", "grit/lifecycle/src", "grit/lifecycle/src/**",
            "grit/assembly/src", "grit/assembly/src/**", "grit/prose/src", "grit/prose/src/**",
            "grit/edge/src", "grit/edge/src/**"]
  - {name: models-code,    kind: module, match: ["grit/models/src", "grit/models/src/**"]}
  - {name: host-code,      kind: module, match: ["grit/host/src", "grit/host/src/**"]}
  - {name: tools-code,     kind: module, match: ["grit/tools/src", "grit/tools/src/**"]}
  - {name: digest-code,    kind: module, match: ["grit/digest/src", "grit/digest/src/**"]}
  - {name: tui-code,       kind: module, match: ["grit/tui/src", "grit/tui/src/**"]}
  - {name: kit-code,       kind: module, match: ["grit/kit/src", "grit/kit/src/**"]}
  - {name: mcp-code,       kind: module, match: ["grit/mcp/src", "grit/mcp/src/**"]}

rules:
  # -------------------------------------------------------------------------------------
  # 1. Only grit.dbos imports DBOS.
  #
  # One rule per imported class, because enola cannot match a whole package: a pattern
  # may only be an exact name, `prefix*`, or `*suffix`, and "* -> dev.dbos.*" is rejected.
  # A class with no rule is not caught outside grit.dbos, so scripts/enola-law.sh fails
  # when grit.dbos imports a quarantined class (DBOS, JDBC, the driver) no rule names.
  # A class nothing in grit.dbos imports can still slip in elsewhere unruled.
  # -------------------------------------------------------------------------------------
  - id: only-dbos-imports-dbos-core
    forbid_name: outside-dbos
    pattern: "* -> dev.dbos.transact.DBOS"
    mode: strict
    because: "STYLE rule 8: dev.dbos.* is quarantined to grit.dbos"

  - id: only-dbos-imports-dbos-client
    forbid_name: outside-dbos
    pattern: "* -> dev.dbos.transact.DBOSClient"
    mode: strict
    because: "STYLE rule 8: dev.dbos.* is quarantined to grit.dbos"

  - id: only-dbos-imports-dbos-config
    forbid_name: outside-dbos
    pattern: "* -> dev.dbos.transact.config.DBOSConfig"
    mode: strict
    because: "STYLE rule 8: dev.dbos.* is quarantined to grit.dbos"

  - id: only-dbos-imports-dbos-txstep
    forbid_name: outside-dbos
    pattern: "* -> dev.dbos.transact.txstep.JdbcStepFactory"
    mode: strict
    because: "STYLE rule 8: dev.dbos.* is quarantined to grit.dbos"

  - id: only-dbos-imports-dbos-registered-workflow
    forbid_name: outside-dbos
    pattern: "* -> dev.dbos.transact.execution.RegisteredWorkflow"
    mode: strict
    because: "STYLE rule 8: dev.dbos.* is quarantined to grit.dbos"

  - id: only-dbos-imports-dbos-throwing-supplier
    forbid_name: outside-dbos
    pattern: "* -> dev.dbos.transact.execution.ThrowingSupplier"
    mode: strict
    because: "STYLE rule 8: dev.dbos.* is quarantined to grit.dbos"

  - id: only-dbos-imports-dbos-workflow-state
    forbid_name: outside-dbos
    pattern: "* -> dev.dbos.transact.workflow.WorkflowState"
    mode: strict
    because: "STYLE rule 8: dev.dbos.* is quarantined to grit.dbos"

  - id: only-dbos-imports-dbos-list-workflows
    forbid_name: outside-dbos
    pattern: "* -> dev.dbos.transact.workflow.ListWorkflowsInput"
    mode: strict
    because: "STYLE rule 8: dev.dbos.* is quarantined to grit.dbos"

  - id: only-dbos-imports-dbos-queue
    forbid_name: outside-dbos
    pattern: "* -> dev.dbos.transact.workflow.Queue"
    mode: strict
    because: "STYLE rule 8: dev.dbos.* is quarantined to grit.dbos"

  - id: only-dbos-imports-dbos-no-such-workflow
    forbid_name: outside-dbos
    pattern: "* -> dev.dbos.transact.exceptions.DBOSNonExistentWorkflowException"
    mode: strict
    because: "STYLE rule 8: dev.dbos.* is quarantined to grit.dbos"


  # -------------------------------------------------------------------------------------
  # 1b. Only grit.dbos imports JDBC or the Postgres driver (STYLE rule 8's other half).
  #
  # java.sql and javax.sql are in the JDK, so no module's classpath lacks them: these
  # rules are the only guard anywhere, not just in grit.app. Same one-class-per-rule
  # limit as above: the classes a JDBC caller cannot avoid, plus the driver's two that
  # grit.dbos uses. Tx.scala's `opaque type Tx = java.sql.Connection` names the class
  # inline, which makes no import edge, so the one legal use outside grit.dbos is not
  # a breach.
  # -------------------------------------------------------------------------------------

  - id: only-dbos-imports-jdbc-connection
    forbid_name: outside-dbos
    pattern: "* -> java.sql.Connection"
    mode: strict
    because: "STYLE rule 8: java.sql, javax.sql and the Postgres driver are quarantined to grit.dbos"

  - id: only-dbos-imports-jdbc-driver-manager
    forbid_name: outside-dbos
    pattern: "* -> java.sql.DriverManager"
    mode: strict
    because: "STYLE rule 8: java.sql, javax.sql and the Postgres driver are quarantined to grit.dbos"

  - id: only-dbos-imports-jdbc-prepared-statement
    forbid_name: outside-dbos
    pattern: "* -> java.sql.PreparedStatement"
    mode: strict
    because: "STYLE rule 8: java.sql, javax.sql and the Postgres driver are quarantined to grit.dbos"

  - id: only-dbos-imports-jdbc-result-set
    forbid_name: outside-dbos
    pattern: "* -> java.sql.ResultSet"
    mode: strict
    because: "STYLE rule 8: java.sql, javax.sql and the Postgres driver are quarantined to grit.dbos"

  - id: only-dbos-imports-jdbc-sql-exception
    forbid_name: outside-dbos
    pattern: "* -> java.sql.SQLException"
    mode: strict
    because: "STYLE rule 8: java.sql, javax.sql and the Postgres driver are quarantined to grit.dbos"

  - id: only-dbos-imports-jdbc-data-source
    forbid_name: outside-dbos
    pattern: "* -> javax.sql.DataSource"
    mode: strict
    because: "STYLE rule 8: java.sql, javax.sql and the Postgres driver are quarantined to grit.dbos"

  - id: only-dbos-imports-jdbc-pg-data-source
    forbid_name: outside-dbos
    pattern: "* -> org.postgresql.ds.PGSimpleDataSource"
    mode: strict
    because: "STYLE rule 8: java.sql, javax.sql and the Postgres driver are quarantined to grit.dbos"

  - id: only-dbos-imports-jdbc-pg-connection
    forbid_name: outside-dbos
    pattern: "* -> org.postgresql.PGConnection"
    mode: strict
    because: "STYLE rule 8: java.sql, javax.sql and the Postgres driver are quarantined to grit.dbos"

  - id: only-dbos-imports-jdbc-psql-exception
    forbid_name: outside-dbos
    pattern: "* -> org.postgresql.util.PSQLException"
    mode: strict
    because: "STYLE rule 8: java.sql, javax.sql and the Postgres driver are quarantined to grit.dbos"

  # -------------------------------------------------------------------------------------
  # 1c. Only grit.models and grit.mcp import the JDK HTTP client: each is an egress of its
  # own, grit.models for model calls and grit.mcp for MCP servers, and neither names the
  # other (mcp-names-core-alone, models-names-core-alone).
  # -------------------------------------------------------------------------------------
  - id: only-models-imports-http-client
    forbid_name: outside-egress
    pattern: "* -> java.net.http.HttpClient"
    mode: strict
    because: "STYLE rule 8: the JDK HTTP client is quarantined to grit.models and grit.mcp, where model calls and MCP requests leave the machine"

  - id: only-models-imports-http-request
    forbid_name: outside-egress
    pattern: "* -> java.net.http.HttpRequest"
    mode: strict
    because: "STYLE rule 8: the JDK HTTP client is quarantined to grit.models and grit.mcp, where model calls and MCP requests leave the machine"

  - id: only-models-imports-http-response
    forbid_name: outside-egress
    pattern: "* -> java.net.http.HttpResponse"
    mode: strict
    because: "STYLE rule 8: the JDK HTTP client is quarantined to grit.models and grit.mcp, where model calls and MCP requests leave the machine"

  # -------------------------------------------------------------------------------------
  # 1d. Only grit.host starts a process: a command runs on the machine, and running things
  # on the machine is grit.host's job, behind grit.core.host.Shell.
  #
  # java.lang needs no import, so these rules see only an import written out: grit.host
  # writes `import java.lang.ProcessBuilder` for that reason. scripts/enola-law.sh also
  # greps the sources for a process started without one. A wildcard import of
  # scala.sys.process is the edge `scala.sys.process`.
  # -------------------------------------------------------------------------------------
  - id: only-host-imports-process-builder
    forbid_name: outside-host
    pattern: "* -> java.lang.ProcessBuilder"
    mode: strict
    because: "STYLE rule 8: starting a process is quarantined to grit.host"

  - id: only-host-imports-sys-process
    forbid_name: outside-host
    pattern: "* -> scala.sys.process"
    mode: strict
    because: "STYLE rule 8: starting a process is quarantined to grit.host"

  - id: only-host-imports-sys-process-process
    forbid_name: outside-host
    pattern: "* -> scala.sys.process.Process"
    mode: strict
    because: "STYLE rule 8: starting a process is quarantined to grit.host"

  # Which machine and process this is, too: grit.host reads it (LocalMachine.identity), and
  # everything else is handed a ProcessIdentity.
  - id: only-host-imports-inet-address
    forbid_name: outside-host
    pattern: "* -> java.net.InetAddress"
    mode: strict
    because: "STYLE rule 8: reading this machine and process is quarantined to grit.host"

  - id: only-host-imports-management-factory
    forbid_name: outside-host
    pattern: "* -> java.lang.management.ManagementFactory"
    mode: strict
    because: "STYLE rule 8: reading this machine and process is quarantined to grit.host"

  # -------------------------------------------------------------------------------------
  # 1e. Only grit.slack imports the Slack SDK: one rule per class it imports, as for DBOS;
  # scripts/enola-law.sh fails when grit.slack imports a com.slack class no rule names.
  # -------------------------------------------------------------------------------------
  - id: only-slack-imports-slack
    forbid_name: outside-slack
    pattern: "* -> com.slack.api.Slack"
    mode: strict
    because: "STYLE rule 8: the Slack SDK is quarantined to grit.slack, which translates it into grit's conventions"

  - id: only-slack-imports-methods-client
    forbid_name: outside-slack
    pattern: "* -> com.slack.api.methods.MethodsClient"
    mode: strict
    because: "STYLE rule 8: the Slack SDK is quarantined to grit.slack, which translates it into grit's conventions"

  - id: only-slack-imports-slack-api-exception
    forbid_name: outside-slack
    pattern: "* -> com.slack.api.methods.SlackApiException"
    mode: strict
    because: "STYLE rule 8: the Slack SDK is quarantined to grit.slack, which translates it into grit's conventions"

  - id: only-slack-imports-slack-api-text-response
    forbid_name: outside-slack
    pattern: "* -> com.slack.api.methods.SlackApiTextResponse"
    mode: strict
    because: "STYLE rule 8: the Slack SDK is quarantined to grit.slack, which translates it into grit's conventions"

  - id: only-slack-imports-auth-test-request
    forbid_name: outside-slack
    pattern: "* -> com.slack.api.methods.request.auth.AuthTestRequest"
    mode: strict
    because: "STYLE rule 8: the Slack SDK is quarantined to grit.slack, which translates it into grit's conventions"

  - id: only-slack-imports-chat-post-message-request
    forbid_name: outside-slack
    pattern: "* -> com.slack.api.methods.request.chat.ChatPostMessageRequest"
    mode: strict
    because: "STYLE rule 8: the Slack SDK is quarantined to grit.slack, which translates it into grit's conventions"

  - id: only-slack-imports-conversations-info-request
    forbid_name: outside-slack
    pattern: "* -> com.slack.api.methods.request.conversations.ConversationsInfoRequest"
    mode: strict
    because: "STYLE rule 8: the Slack SDK is quarantined to grit.slack, which translates it into grit's conventions"

  - id: only-slack-imports-conversations-replies-request
    forbid_name: outside-slack
    pattern: "* -> com.slack.api.methods.request.conversations.ConversationsRepliesRequest"
    mode: strict
    because: "STYLE rule 8: the Slack SDK is quarantined to grit.slack, which translates it into grit's conventions"

  - id: only-slack-imports-conversations-history-request
    forbid_name: outside-slack
    pattern: "* -> com.slack.api.methods.request.conversations.ConversationsHistoryRequest"
    mode: strict
    because: "STYLE rule 8: the Slack SDK is quarantined to grit.slack, which translates it into grit's conventions"

  - id: only-slack-imports-reactions-add-request
    forbid_name: outside-slack
    pattern: "* -> com.slack.api.methods.request.reactions.ReactionsAddRequest"
    mode: strict
    because: "STYLE rule 8: the Slack SDK is quarantined to grit.slack, which translates it into grit's conventions"

  - id: only-slack-imports-reactions-remove-request
    forbid_name: outside-slack
    pattern: "* -> com.slack.api.methods.request.reactions.ReactionsRemoveRequest"
    mode: strict
    because: "STYLE rule 8: the Slack SDK is quarantined to grit.slack, which translates it into grit's conventions"

  - id: only-slack-imports-users-info-request
    forbid_name: outside-slack
    pattern: "* -> com.slack.api.methods.request.users.UsersInfoRequest"
    mode: strict
    because: "STYLE rule 8: the Slack SDK is quarantined to grit.slack, which translates it into grit's conventions"

  - id: only-slack-imports-message
    forbid_name: outside-slack
    pattern: "* -> com.slack.api.model.Message"
    mode: strict
    because: "STYLE rule 8: the Slack SDK is quarantined to grit.slack, which translates it into grit's conventions"

  - id: only-slack-imports-response-metadata
    forbid_name: outside-slack
    pattern: "* -> com.slack.api.model.ResponseMetadata"
    mode: strict
    because: "STYLE rule 8: the Slack SDK is quarantined to grit.slack, which translates it into grit's conventions"

  - id: only-slack-imports-socket-mode-client
    forbid_name: outside-slack
    pattern: "* -> com.slack.api.socket_mode.SocketModeClient"
    mode: strict
    because: "STYLE rule 8: the Slack SDK is quarantined to grit.slack, which translates it into grit's conventions"

  - id: only-slack-imports-events-api-envelope
    forbid_name: outside-slack
    pattern: "* -> com.slack.api.socket_mode.request.EventsApiEnvelope"
    mode: strict
    because: "STYLE rule 8: the Slack SDK is quarantined to grit.slack, which translates it into grit's conventions"

  - id: only-slack-imports-ack-response
    forbid_name: outside-slack
    pattern: "* -> com.slack.api.socket_mode.response.AckResponse"
    mode: strict
    because: "STYLE rule 8: the Slack SDK is quarantined to grit.slack, which translates it into grit's conventions"

  - id: only-slack-imports-slack-config
    forbid_name: outside-slack
    pattern: "* -> com.slack.api.SlackConfig"
    mode: strict
    because: "STYLE rule 8: the Slack SDK is quarantined to grit.slack, which translates it into grit's conventions"

  # grit.slack names core and prose alone: an edge reaches the engine through Postgres (ADR
  # 0002) and never the turn. Mill already keeps grit.turn off its classpath; this rule is the
  # record of the intent, and the guard if a moduleDeps entry is ever added.
  - id: slack-names-core-and-prose
    allow: slack-code
    only: [core-code, prose-code, slack-code]
    via: imports
    mode: strict
    because: "an edge reaches the engine only through Postgres (ADR 0002): grit.slack names grit.core's traits and grit.prose's form, never grit.turn or an implementation"

  # -------------------------------------------------------------------------------------
  # 2. grit.tui's import direction: each group lists what it may import.
  #
  #      model       -> nothing else
  #      wire        -> model
  #      components  -> model, grit.core
  #      runtime     -> anything (no rule)
  #
  # Watch out:
  #   - Use `via: imports`. `via: depends_on` (what enola's recipes use) never fires on
  #     Scala, so a rule using it always passes.
  #   - Only imports are seen. A fully-qualified name written inline without an import
  #     slips through; tui's QuarantineTests catches that case.
  #   - Imports of the standard library or other libraries are not counted as breaches.
  # -------------------------------------------------------------------------------------
  - id: tui-model-names-no-other-group
    allow: tui-model
    only: [tui-model]
    via: imports
    mode: strict
    because: "grit.tui.model is the pure cell model; it names no other group and no grit domain type, so it is testable with no fixtures"

  - id: tui-wire-names-only-model
    allow: tui-wire
    only: [tui-model, tui-wire]
    via: imports
    mode: strict
    because: "wire turns surfaces into bytes and back; naming components or the domain would couple the terminal seam to what is drawn"

  - id: tui-components-name-model-and-core
    allow: tui-components
    only: [tui-model, tui-components, core-code]
    via: imports
    mode: strict
    because: "components are the surface grit's screens are written against: they may render grit.core types, but never reach the terminal (wire) or the loop (runtime)"

  # -------------------------------------------------------------------------------------
  # 3. grit.prose is edge-neutral: the form every edge renders names no other grit module,
  # so a renderer (grit.tui's, a future Slack edge's) depends on it and never the reverse.
  # Mill already keeps grit.prose off every other module's classpath; this rule is the
  # record of the intent, and the one guard if a moduleDeps entry is ever added.
  # -------------------------------------------------------------------------------------
  - id: prose-names-no-other-module
    allow: prose-code
    only: [prose-code]
    via: imports
    mode: strict
    because: "grit.prose is the edge-neutral form a reply is rendered from; naming grit.tui, grit.core or any edge would make it one edge's form"

  # -------------------------------------------------------------------------------------
  # 4. Core, extensions, kit and deployments (ADR 0021): an extension module is named only
  # by the kit and by a deployment. Core names no extension; each extension names core
  # alone (grit.slack's rule above says it for Slack); the kit names no edge extension, no
  # terminal UI and no deployment, since an edge reaches it as a ServedEdge value. Mill's
  # moduleDeps already keep each of these off the classpath; the rules are the record of the
  # intent, and the guard if a moduleDeps entry is ever added. grit.eval, an it-only
  # harness, is unruled.
  # -------------------------------------------------------------------------------------
  - id: core-names-no-extension
    allow: core-modules
    only: [core-modules]
    via: imports
    mode: strict
    because: "ADR 0021: core is what the thesis fails without; naming an extension would make every deployment carry it"

  - id: models-names-core-alone
    allow: models-code
    only: [core-modules, models-code]
    via: imports
    mode: strict
    because: "ADR 0021: a shipped extension implements core's traits and names no other extension"

  - id: host-names-core-alone
    allow: host-code
    only: [core-modules, host-code]
    via: imports
    mode: strict
    because: "ADR 0021: a shipped extension implements core's traits and names no other extension"

  - id: tools-names-core-alone
    allow: tools-code
    only: [core-modules, tools-code]
    via: imports
    mode: strict
    because: "ADR 0021: a shipped extension implements core's traits and names no other extension"

  - id: digest-names-core-alone
    allow: digest-code
    only: [core-modules, digest-code]
    via: imports
    mode: strict
    because: "ADR 0021: a shipped extension implements core's traits and names no other extension"

  - id: mcp-names-core-alone
    allow: mcp-code
    only: [core-modules, mcp-code]
    via: imports
    mode: strict
    because: "ADR 0021: a shipped extension implements core's traits and names no other extension"

  - id: tui-names-core-alone
    allow: tui-code
    only: [core-modules, tui-code]
    via: imports
    mode: strict
