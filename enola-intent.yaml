# grit's architecture law, checked by `bash scripts/enola-law.sh`.
#
# It enforces these things:
#   1. Only grit.dbos may import dev.dbos.*, JDBC or the Postgres driver, only
#      grit.models and grit.mcp the JDK HTTP client, only grit.slack the Slack SDK, and only
#      grit.host may start a process (STYLE rule 8); grit.slack names core and prose alone;
#      and only grit.dbos (besides core's visibility package) names a label's stored parts (ADR 0030)
#   2. grit.tui's four groups import in one direction (extensions/tui/CLAUDE.md)
#   3. grit.prose names no other grit module (core/prose/README.md)
#   4. core names no extension, each extension names core alone (a plugin extension, such as
#      grit.digest or grit.remind, names core and plugin extensions), and the kit names no
#      plugin, edge extension, terminal UI or deployment (ADRs 0021, 0027; docs/extending.md)
#   5. grit.mcp's protocol, scope, client and edge name no GitHub package (extensions/mcp/README.md)
#
# Every rule was watched failing on a deliberately planted bad import before it was
# adopted. Do the same for any new rule: a rule that can't fail passes silently.
# The evidence for each choice below is in roadmap/decisions.md (2026-09-23 rows).

service:
  name: grit
  description: LLM coding harness whose prompt is a computed projection over Postgres

# No `layers:` block, on purpose. Between Mill modules, Mill already rejects both cycles and
# undeclared imports. Inside tui, the strict rules below are stricter than a layer order
# can be. A layer violation is only ever an advisory, so it would repeat a failure that is
# already reported.

# ---------------------------------------------------------------------------------------
# Components: named sets of code that the rules refer to. Paths start at the repo root.
# ---------------------------------------------------------------------------------------
components:
  # Every module except grit.dbos. For most of them these rules duplicate a compile error
  # (no DBOS on their classpath). grit.kit, grit.app and grit.eval are the exceptions: they depend on
  # grit.dbos, and Mill's moduleDeps are transitive, so these rules are the only guard there.
  - name: outside-dbos
    kind: dependency
    match: ["core/core/**", "extensions/tui/**", "core/turn/**", "extensions/models/**", "core/assembly/**", "kit/**", "deployments/app/**", "eval/**", "core/prose/**", "extensions/host/**", "extensions/tools/**", "core/lifecycle/**", "core/job/**", "extensions/digest/**", "extensions/remind/**", "core/edge/**", "extensions/slack/**", "extensions/mcp/**"]

  # Every module except grit.dbos and the eval harness: what may not name grit.dbos.internal
  # (rule 1h). As outside-dbos, with eval's own sources in place of all of eval/.
  - name: outside-dbos-and-harness
    kind: dependency
    match: ["core/core/**", "extensions/tui/**", "core/turn/**", "extensions/models/**", "core/assembly/**", "kit/**", "deployments/app/**", "eval/src/**", "eval/it/**", "eval/test/**", "core/prose/**", "extensions/host/**", "extensions/tools/**", "core/lifecycle/**", "core/job/**", "extensions/digest/**", "extensions/remind/**", "core/edge/**", "extensions/slack/**", "extensions/mcp/**"]

  # Every module except grit.models and grit.mcp, the two egresses, for the HTTP quarantine
  # (STYLE rule 8).
  - name: outside-egress
    kind: dependency
    match: ["core/core/**", "extensions/tui/**", "core/turn/**", "core/dbos/**", "core/assembly/**", "kit/**", "deployments/app/**", "eval/**", "core/prose/**", "extensions/host/**", "extensions/tools/**", "core/lifecycle/**", "core/job/**", "extensions/digest/**", "extensions/remind/**", "core/edge/**", "extensions/slack/**"]

  # Every module except grit.host, for the process quarantine (STYLE rule 8).
  - name: outside-host
    kind: dependency
    match: ["core/core/**", "extensions/tui/**", "core/turn/**", "core/dbos/**", "extensions/models/**", "core/assembly/**", "kit/**", "deployments/app/**", "eval/**", "core/prose/**", "extensions/tools/**", "core/lifecycle/**", "core/job/**", "extensions/digest/**", "extensions/remind/**", "core/edge/**", "extensions/slack/**", "extensions/mcp/**"]

  # Every module except grit.slack, for the Slack SDK's quarantine (STYLE rule 8).
  - name: outside-slack
    kind: dependency
    match: ["core/core/**", "extensions/tui/**", "core/turn/**", "core/dbos/**", "extensions/models/**", "core/assembly/**", "kit/**", "deployments/app/**", "eval/**", "core/prose/**", "extensions/host/**", "extensions/tools/**", "core/lifecycle/**", "core/job/**", "extensions/digest/**", "extensions/remind/**", "core/edge/**", "extensions/mcp/**"]

  # grit.slack's sources, for its rule below: an edge names core, prose and grit.edge, never
  # the turn.
  - {name: slack-code,     kind: module, match: ["extensions/slack/src", "extensions/slack/src/**"]}

  # grit.edge's sources alone, for slack's rule: core-modules also holds grit.turn, which an
  # edge must never name.
  - {name: edge-code,      kind: module, match: ["core/edge/src", "core/edge/src/**"]}

  # The tui groups, for the direction rules. `runtime` needs no entry: it may import
  # every group.
  - {name: core-code,      kind: module, match: ["core/core/src", "core/core/src/**"]}
  - {name: tui-model,      kind: module, match: ["extensions/tui/src/model", "extensions/tui/src/model/**"]}
  - {name: tui-components, kind: module, match: ["extensions/tui/src/components", "extensions/tui/src/components/**"]}
  - {name: tui-wire,       kind: module, match: ["extensions/tui/src/wire", "extensions/tui/src/wire/**"]}

  # grit.prose, for its rule below: the source tree alone, so a test's imports are not
  # counted against it.
  - {name: prose-code,     kind: module, match: ["core/prose/src", "core/prose/src/**"]}

  # Core, extension, kit and deployment (ADR 0021; the table is docs/extending.md's), for
  # rule 4 below. Source trees alone, so a test's imports are not counted. Which core module
  # may name which is Mill's moduleDeps' job, not these rules'.
  - name: core-modules
    kind: module
    match: ["core/core/src", "core/core/src/**", "core/dbos/src", "core/dbos/src/**",
            "core/turn/src", "core/turn/src/**", "core/lifecycle/src", "core/lifecycle/src/**",
            "core/assembly/src", "core/assembly/src/**", "core/prose/src", "core/prose/src/**",
            "core/edge/src", "core/edge/src/**", "core/job/src", "core/job/src/**"]
  - {name: models-code,    kind: module, match: ["extensions/models/src", "extensions/models/src/**"]}
  - {name: host-code,      kind: module, match: ["extensions/host/src", "extensions/host/src/**"]}
  - {name: tools-code,     kind: module, match: ["extensions/tools/src", "extensions/tools/src/**"]}
  # Every plugin extension: one that implements Plugin and nothing else core lets it supply.
  # A new plugin extension joins this list.
  - name: plugin-extensions
    kind: module
    match: ["extensions/digest/src", "extensions/digest/src/**",
            "extensions/remind/src", "extensions/remind/src/**"]
  - {name: tui-code,       kind: module, match: ["extensions/tui/src", "extensions/tui/src/**"]}
  - {name: kit-code,       kind: module, match: ["kit/src", "kit/src/**"]}
  - {name: mcp-code,       kind: module, match: ["extensions/mcp/src", "extensions/mcp/src/**"]}
  - {name: harness-code,   kind: module, match: ["eval/harness/src", "eval/harness/src/**"]}
  # grit.eval's main sources alone (its cases and their layout), for its rule and the
  # harness's; its integration sources, the assembly eval, are unruled.
  - {name: eval-code,      kind: module, match: ["eval/src", "eval/src/**"]}
  # The kit's .env loader alone, for the harness's rule: it reads the key as grit.app does.
  - {name: kit-environment, kind: module, match: ["kit/src/environment", "kit/src/environment/**"]}
  # grit.mcp less its github package, for the rule that keeps the protocol, client, scope
  # and edge generic: GitHub's names are a package a deployment uses, never one they import.
  - name: mcp-generic
    kind: module
    match: ["extensions/mcp/src/wire", "extensions/mcp/src/wire/**", "extensions/mcp/src/scope", "extensions/mcp/src/scope/**",
            "extensions/mcp/src/client", "extensions/mcp/src/client/**", "extensions/mcp/src/edge", "extensions/mcp/src/edge/**"]

rules:
  # -------------------------------------------------------------------------------------
  # 1. Only grit.dbos imports DBOS.
  #
  # One rule per imported class, because enola cannot match a whole package: a pattern
  # may only be an exact name, `prefix*`, or `*suffix`, and "* -> dev.dbos.*" is rejected.
  # A class with no rule is not caught outside grit.dbos, so scripts/enola-law.sh fails
  # when grit.dbos imports a quarantined class (DBOS, JDBC, the driver) no rule names.
  # A class nothing in grit.dbos imports can still slip in elsewhere unruled.
  # -------------------------------------------------------------------------------------
  - id: only-dbos-imports-dbos-core
    forbid_name: outside-dbos
    pattern: "* -> dev.dbos.transact.DBOS"
    mode: strict
    because: "STYLE rule 8: dev.dbos.* is quarantined to grit.dbos"

  - id: only-dbos-imports-dbos-client
    forbid_name: outside-dbos
    pattern: "* -> dev.dbos.transact.DBOSClient"
    mode: strict
    because: "STYLE rule 8: dev.dbos.* is quarantined to grit.dbos"

  - id: only-dbos-imports-dbos-config
    forbid_name: outside-dbos
    pattern: "* -> dev.dbos.transact.config.DBOSConfig"
    mode: strict
    because: "STYLE rule 8: dev.dbos.* is quarantined to grit.dbos"

  - id: only-dbos-imports-dbos-txstep
    forbid_name: outside-dbos
    pattern: "* -> dev.dbos.transact.txstep.JdbcStepFactory"
    mode: strict
    because: "STYLE rule 8: dev.dbos.* is quarantined to grit.dbos"

  - id: only-dbos-imports-dbos-registered-workflow
    forbid_name: outside-dbos
    pattern: "* -> dev.dbos.transact.execution.RegisteredWorkflow"
    mode: strict
    because: "STYLE rule 8: dev.dbos.* is quarantined to grit.dbos"

  - id: only-dbos-imports-dbos-throwing-supplier
    forbid_name: outside-dbos
    pattern: "* -> dev.dbos.transact.execution.ThrowingSupplier"
    mode: strict
    because: "STYLE rule 8: dev.dbos.* is quarantined to grit.dbos"

  - id: only-dbos-imports-dbos-workflow-state
    forbid_name: outside-dbos
    pattern: "* -> dev.dbos.transact.workflow.WorkflowState"
    mode: strict
    because: "STYLE rule 8: dev.dbos.* is quarantined to grit.dbos"

  - id: only-dbos-imports-dbos-list-workflows
    forbid_name: outside-dbos
    pattern: "* -> dev.dbos.transact.workflow.ListWorkflowsInput"
    mode: strict
    because: "STYLE rule 8: dev.dbos.* is quarantined to grit.dbos"

  - id: only-dbos-imports-dbos-enqueue-options
    forbid_name: outside-dbos
    pattern: "* -> dev.dbos.transact.EnqueueOptions"
    mode: strict
    because: "STYLE rule 8: dev.dbos.* is quarantined to grit.dbos"

  - id: only-dbos-imports-dbos-queue-name
    forbid_name: outside-dbos
    pattern: "* -> dev.dbos.transact.workflow.QueueName"
    mode: strict
    because: "STYLE rule 8: dev.dbos.* is quarantined to grit.dbos"

  - id: only-dbos-imports-dbos-queue-options
    forbid_name: outside-dbos
    pattern: "* -> dev.dbos.transact.workflow.QueueOptions"
    mode: strict
    because: "STYLE rule 8: dev.dbos.* is quarantined to grit.dbos"

  - id: only-dbos-imports-dbos-queue-conflict
    forbid_name: outside-dbos
    pattern: "* -> dev.dbos.transact.workflow.QueueConflictResolution"
    mode: strict
    because: "STYLE rule 8: dev.dbos.* is quarantined to grit.dbos"

  - id: only-dbos-imports-dbos-migrations
    forbid_name: outside-dbos
    pattern: "* -> dev.dbos.transact.migrations.MigrationManager"
    mode: strict
    because: "STYLE rule 8: dev.dbos.* is quarantined to grit.dbos"

  - id: only-dbos-imports-dbos-no-such-workflow
    forbid_name: outside-dbos
    pattern: "* -> dev.dbos.transact.exceptions.DBOSNonExistentWorkflowException"
    mode: strict
    because: "STYLE rule 8: dev.dbos.* is quarantined to grit.dbos"


  # -------------------------------------------------------------------------------------
  # 1b. Only grit.dbos imports JDBC or the Postgres driver (STYLE rule 8's other half).
  #
  # java.sql and javax.sql are in the JDK, so no module's classpath lacks them: these
  # rules are the only guard anywhere, not just in grit.app. Same one-class-per-rule
  # limit as above: the classes a JDBC caller cannot avoid, plus the driver's two that
  # grit.dbos uses. Tx.scala's `opaque type Tx = java.sql.Connection` names the class
  # inline, which makes no import edge, so the one legal use outside grit.dbos is not
  # a breach.
  # -------------------------------------------------------------------------------------

  - id: only-dbos-imports-jdbc-connection
    forbid_name: outside-dbos
    pattern: "* -> java.sql.Connection"
    mode: strict
    because: "STYLE rule 8: java.sql, javax.sql and the Postgres driver are quarantined to grit.dbos"

  - id: only-dbos-imports-jdbc-driver-manager
    forbid_name: outside-dbos
    pattern: "* -> java.sql.DriverManager"
    mode: strict
    because: "STYLE rule 8: java.sql, javax.sql and the Postgres driver are quarantined to grit.dbos"

  - id: only-dbos-imports-jdbc-prepared-statement
    forbid_name: outside-dbos
    pattern: "* -> java.sql.PreparedStatement"
    mode: strict
    because: "STYLE rule 8: java.sql, javax.sql and the Postgres driver are quarantined to grit.dbos"

  - id: only-dbos-imports-jdbc-result-set
    forbid_name: outside-dbos
    pattern: "* -> java.sql.ResultSet"
    mode: strict
    because: "STYLE rule 8: java.sql, javax.sql and the Postgres driver are quarantined to grit.dbos"

  - id: only-dbos-imports-jdbc-sql-exception
    forbid_name: outside-dbos
    pattern: "* -> java.sql.SQLException"
    mode: strict
    because: "STYLE rule 8: java.sql, javax.sql and the Postgres driver are quarantined to grit.dbos"

  - id: only-dbos-imports-jdbc-data-source
    forbid_name: outside-dbos
    pattern: "* -> javax.sql.DataSource"
    mode: strict
    because: "STYLE rule 8: java.sql, javax.sql and the Postgres driver are quarantined to grit.dbos"

  - id: only-dbos-imports-jdbc-pg-data-source
    forbid_name: outside-dbos
    pattern: "* -> org.postgresql.ds.PGSimpleDataSource"
    mode: strict
    because: "STYLE rule 8: java.sql, javax.sql and the Postgres driver are quarantined to grit.dbos"

  - id: only-dbos-imports-jdbc-pg-connection
    forbid_name: outside-dbos
    pattern: "* -> org.postgresql.PGConnection"
    mode: strict
    because: "STYLE rule 8: java.sql, javax.sql and the Postgres driver are quarantined to grit.dbos"

  - id: only-dbos-imports-jdbc-psql-exception
    forbid_name: outside-dbos
    pattern: "* -> org.postgresql.util.PSQLException"
    mode: strict
    because: "STYLE rule 8: java.sql, javax.sql and the Postgres driver are quarantined to grit.dbos"

  # -------------------------------------------------------------------------------------
  # 1c. Only grit.models and grit.mcp import the JDK HTTP client: each is an egress of its
  # own, grit.models for model calls and grit.mcp for MCP servers, and neither names the
  # other (mcp-names-core-alone, models-names-core-alone).
  # -------------------------------------------------------------------------------------
  - id: only-models-imports-http-client
    forbid_name: outside-egress
    pattern: "* -> java.net.http.HttpClient"
    mode: strict
    because: "STYLE rule 8: the JDK HTTP client is quarantined to grit.models and grit.mcp, where model calls and MCP requests leave the machine"

  - id: only-models-imports-http-request
    forbid_name: outside-egress
    pattern: "* -> java.net.http.HttpRequest"
    mode: strict
    because: "STYLE rule 8: the JDK HTTP client is quarantined to grit.models and grit.mcp, where model calls and MCP requests leave the machine"

  - id: only-models-imports-http-response
    forbid_name: outside-egress
    pattern: "* -> java.net.http.HttpResponse"
    mode: strict
    because: "STYLE rule 8: the JDK HTTP client is quarantined to grit.models and grit.mcp, where model calls and MCP requests leave the machine"

  # -------------------------------------------------------------------------------------
  # 1d. Only grit.host starts a process: a command runs on the machine, and running things
  # on the machine is grit.host's job, behind grit.core.host.Shell.
  #
  # java.lang needs no import, so these rules see only an import written out: grit.host
  # writes `import java.lang.ProcessBuilder` for that reason. scripts/enola-law.sh also
  # greps the sources for a process started without one. A wildcard import of
  # scala.sys.process is the edge `scala.sys.process`.
  # -------------------------------------------------------------------------------------
  - id: only-host-imports-process-builder
    forbid_name: outside-host
    pattern: "* -> java.lang.ProcessBuilder"
    mode: strict
    because: "STYLE rule 8: starting a process is quarantined to grit.host"

  - id: only-host-imports-sys-process
    forbid_name: outside-host
    pattern: "* -> scala.sys.process"
    mode: strict
    because: "STYLE rule 8: starting a process is quarantined to grit.host"

  - id: only-host-imports-sys-process-process
    forbid_name: outside-host
    pattern: "* -> scala.sys.process.Process"
    mode: strict
    because: "STYLE rule 8: starting a process is quarantined to grit.host"

  # Which machine and process this is, too: grit.host reads it (LocalMachine.identity), and
  # everything else is handed a ProcessIdentity.
  - id: only-host-imports-inet-address
    forbid_name: outside-host
    pattern: "* -> java.net.InetAddress"
    mode: strict
    because: "STYLE rule 8: reading this machine and process is quarantined to grit.host"

  - id: only-host-imports-management-factory
    forbid_name: outside-host
    pattern: "* -> java.lang.management.ManagementFactory"
    mode: strict
    because: "STYLE rule 8: reading this machine and process is quarantined to grit.host"

  # -------------------------------------------------------------------------------------
  # 1e. Only grit.slack imports the Slack SDK: one rule per class it imports, as for DBOS;
  # scripts/enola-law.sh fails when grit.slack imports a com.slack class no rule names.
  # -------------------------------------------------------------------------------------
  - id: only-slack-imports-slack
    forbid_name: outside-slack
    pattern: "* -> com.slack.api.Slack"
    mode: strict
    because: "STYLE rule 8: the Slack SDK is quarantined to grit.slack, which translates it into grit's conventions"

  - id: only-slack-imports-methods-client
    forbid_name: outside-slack
    pattern: "* -> com.slack.api.methods.MethodsClient"
    mode: strict
    because: "STYLE rule 8: the Slack SDK is quarantined to grit.slack, which translates it into grit's conventions"

  - id: only-slack-imports-slack-api-exception
    forbid_name: outside-slack
    pattern: "* -> com.slack.api.methods.SlackApiException"
    mode: strict
    because: "STYLE rule 8: the Slack SDK is quarantined to grit.slack, which translates it into grit's conventions"

  - id: only-slack-imports-slack-api-text-response
    forbid_name: outside-slack
    pattern: "* -> com.slack.api.methods.SlackApiTextResponse"
    mode: strict
    because: "STYLE rule 8: the Slack SDK is quarantined to grit.slack, which translates it into grit's conventions"

  - id: only-slack-imports-auth-test-request
    forbid_name: outside-slack
    pattern: "* -> com.slack.api.methods.request.auth.AuthTestRequest"
    mode: strict
    because: "STYLE rule 8: the Slack SDK is quarantined to grit.slack, which translates it into grit's conventions"

  - id: only-slack-imports-chat-post-message-request
    forbid_name: outside-slack
    pattern: "* -> com.slack.api.methods.request.chat.ChatPostMessageRequest"
    mode: strict
    because: "STYLE rule 8: the Slack SDK is quarantined to grit.slack, which translates it into grit's conventions"

  - id: only-slack-imports-conversations-info-request
    forbid_name: outside-slack
    pattern: "* -> com.slack.api.methods.request.conversations.ConversationsInfoRequest"
    mode: strict
    because: "STYLE rule 8: the Slack SDK is quarantined to grit.slack, which translates it into grit's conventions"

  - id: only-slack-imports-conversations-replies-request
    forbid_name: outside-slack
    pattern: "* -> com.slack.api.methods.request.conversations.ConversationsRepliesRequest"
    mode: strict
    because: "STYLE rule 8: the Slack SDK is quarantined to grit.slack, which translates it into grit's conventions"

  - id: only-slack-imports-conversations-history-request
    forbid_name: outside-slack
    pattern: "* -> com.slack.api.methods.request.conversations.ConversationsHistoryRequest"
    mode: strict
    because: "STYLE rule 8: the Slack SDK is quarantined to grit.slack, which translates it into grit's conventions"

  - id: only-slack-imports-chat-get-permalink-request
    forbid_name: outside-slack
    pattern: "* -> com.slack.api.methods.request.chat.ChatGetPermalinkRequest"
    mode: strict
    because: "STYLE rule 8: the Slack SDK is quarantined to grit.slack, which translates it into grit's conventions"

  - id: only-slack-imports-reactions-add-request
    forbid_name: outside-slack
    pattern: "* -> com.slack.api.methods.request.reactions.ReactionsAddRequest"
    mode: strict
    because: "STYLE rule 8: the Slack SDK is quarantined to grit.slack, which translates it into grit's conventions"

  - id: only-slack-imports-reactions-remove-request
    forbid_name: outside-slack
    pattern: "* -> com.slack.api.methods.request.reactions.ReactionsRemoveRequest"
    mode: strict
    because: "STYLE rule 8: the Slack SDK is quarantined to grit.slack, which translates it into grit's conventions"

  - id: only-slack-imports-users-info-request
    forbid_name: outside-slack
    pattern: "* -> com.slack.api.methods.request.users.UsersInfoRequest"
    mode: strict
    because: "STYLE rule 8: the Slack SDK is quarantined to grit.slack, which translates it into grit's conventions"

  - id: only-slack-imports-message
    forbid_name: outside-slack
    pattern: "* -> com.slack.api.model.Message"
    mode: strict
    because: "STYLE rule 8: the Slack SDK is quarantined to grit.slack, which translates it into grit's conventions"

  - id: only-slack-imports-response-metadata
    forbid_name: outside-slack
    pattern: "* -> com.slack.api.model.ResponseMetadata"
    mode: strict
    because: "STYLE rule 8: the Slack SDK is quarantined to grit.slack, which translates it into grit's conventions"

  - id: only-slack-imports-socket-mode-client
    forbid_name: outside-slack
    pattern: "* -> com.slack.api.socket_mode.SocketModeClient"
    mode: strict
    because: "STYLE rule 8: the Slack SDK is quarantined to grit.slack, which translates it into grit's conventions"

  - id: only-slack-imports-events-api-envelope
    forbid_name: outside-slack
    pattern: "* -> com.slack.api.socket_mode.request.EventsApiEnvelope"
    mode: strict
    because: "STYLE rule 8: the Slack SDK is quarantined to grit.slack, which translates it into grit's conventions"

  - id: only-slack-imports-ack-response
    forbid_name: outside-slack
    pattern: "* -> com.slack.api.socket_mode.response.AckResponse"
    mode: strict
    because: "STYLE rule 8: the Slack SDK is quarantined to grit.slack, which translates it into grit's conventions"

  - id: only-slack-imports-slack-config
    forbid_name: outside-slack
    pattern: "* -> com.slack.api.SlackConfig"
    mode: strict
    because: "STYLE rule 8: the Slack SDK is quarantined to grit.slack, which translates it into grit's conventions"

  # -------------------------------------------------------------------------------------
  # 1f. Only grit.dbos names a label's stored parts (ADR 0030): code outside core is parametric
  # in labels, and the parts view is the one way to take a label apart. grit.dbos stores and
  # filters labels by their parts; core's visibility package defines the view and never imports
  # it, which is why outside-dbos, which holds that package, can be this rule's component.
  #
  # Watch out:
  #   - A fully qualified use, or one through `import grit.core.visibility.*`, makes no edge
  #     to LabelParts; scripts/enola-law.sh greps every source for the name instead.
  #   - A component's `exclude:` key is accepted by lint and silently ignored, so a part of
  #     core cannot be carved out of a component that way: a test outside the visibility
  #     package that needs the parts belongs in grit.dbos's tests.
  # -------------------------------------------------------------------------------------
  - id: only-dbos-names-label-parts
    forbid_name: outside-dbos
    pattern: "* -> grit.core.visibility.LabelParts"
    mode: strict
    because: "ADR 0030: a label is compared, joined, met and keyed by outside core, never taken apart; its stored parts are grit.dbos's and core's visibility package's alone"

  # -------------------------------------------------------------------------------------
  # 1g. Only grit.dbos opens a transaction at maintenance's clearance (ADR 0030): every row,
  # whatever its label. Everything else opens one for a Subject, which the opener resolves, so
  # nothing outside grit.dbos can read past what its subject is cleared for. Core's visibility
  # package defines Maintenance and never imports it, as with 1f.
  #
  # Watch out: a fully qualified use, or one through `import grit.core.visibility.*`, makes no
  # edge to Maintenance; scripts/enola-law.sh greps every source for the name instead.
  # -------------------------------------------------------------------------------------
  - id: only-dbos-names-maintenance
    forbid_name: outside-dbos
    pattern: "* -> grit.core.visibility.Maintenance"
    mode: strict
    because: "ADR 0030: maintenance reads every row whatever its label; only grit.dbos's own transactions (inbox, desk, sweeps, collector) open at it"

  # -------------------------------------------------------------------------------------
  # 1h. Only grit.dbos and the eval harness name grit.dbos.internal (ADR 0030): what grit.dbos
  # lends the harness alone. Its Reader's `all` reads every row at maintenance's clearance, for
  # capturing a database whole; a deployment, kit or an edge holding one could read past every
  # subject.
  #
  # Watch out:
  #   - forbid_name matches the whole edge, `<from> -> <name>`, as an exact string, a prefix*
  #     or a *suffix, so no pattern names every edge into a package: "grit.dbos.internal*"
  #     lints and matches nothing, and "* -> grit.dbos.internal.*" is refused. The rule names
  #     the package's one public name, Reader (EngineStarts is private[dbos]); a public name
  #     added to the package joins it.
  #   - As 1f and 1g, a fully qualified use or a wildcard import makes no edge at all;
  #     scripts/enola-law.sh greps every source for the package, which covers all its names.
  # -------------------------------------------------------------------------------------
  - id: only-dbos-and-harness-name-dbos-internal
    forbid_name: outside-dbos-and-harness
    pattern: "* -> grit.dbos.internal.Reader"
    mode: strict
    because: "ADR 0030: grit.dbos.internal's Reader reads every row whatever its label; only grit.dbos and the eval harness, which captures databases whole, may name the package"

  # grit.slack names core, prose and grit.edge alone: an edge reaches the engine through
  # Postgres (ADR 0002) and never the turn; grit.edge is the edge's side of the desk it serves
  # slack_post through. Mill already keeps grit.turn off its classpath; this rule is the
  # record of the intent, and the guard if a moduleDeps entry is ever added.
  - id: slack-names-core-prose-and-edge
    allow: slack-code
    only: [core-code, prose-code, edge-code, slack-code]
    via: imports
    mode: strict
    because: "an edge reaches the engine only through Postgres (ADR 0002): grit.slack names grit.core's traits, grit.prose's form and grit.edge's server, never grit.turn or an implementation"

  # -------------------------------------------------------------------------------------
  # 2. grit.tui's import direction: each group lists what it may import.
  #
  #      model       -> nothing else
  #      wire        -> model
  #      components  -> model, grit.core
  #      runtime     -> anything (no rule)
  #
  # Watch out:
  #   - Use `via: imports`. `via: depends_on` (what enola's recipes use) never fires on
  #     Scala, so a rule using it always passes.
  #   - Only imports are seen. A fully-qualified name written inline without an import
  #     slips through; tui's QuarantineTests catches that case.
  #   - Imports of the standard library or other libraries are not counted as breaches.
  # -------------------------------------------------------------------------------------
  - id: tui-model-names-no-other-group
    allow: tui-model
    only: [tui-model]
    via: imports
    mode: strict
    because: "grit.tui.model is the pure cell model; it names no other group and no grit domain type, so it is testable with no fixtures"

  - id: tui-wire-names-only-model
    allow: tui-wire
    only: [tui-model, tui-wire]
    via: imports
    mode: strict
    because: "wire turns surfaces into bytes and back; naming components or the domain would couple the terminal seam to what is drawn"

  - id: tui-components-name-model-and-core
    allow: tui-components
    only: [tui-model, tui-components, core-code]
    via: imports
    mode: strict
    because: "components are the surface grit's screens are written against: they may render grit.core types, but never reach the terminal (wire) or the loop (runtime)"

  # -------------------------------------------------------------------------------------
  # 3. grit.prose is edge-neutral: the form every edge renders names no other grit module,
  # so a renderer (grit.tui's, a future Slack edge's) depends on it and never the reverse.
  # Mill already keeps grit.prose off every other module's classpath; this rule is the
  # record of the intent, and the one guard if a moduleDeps entry is ever added.
  # -------------------------------------------------------------------------------------
  - id: prose-names-no-other-module
    allow: prose-code
    only: [prose-code]
    via: imports
    mode: strict
    because: "grit.prose is the edge-neutral form a reply is rendered from; naming grit.tui, grit.core or any edge would make it one edge's form"

  # -------------------------------------------------------------------------------------
  # 4. Core, extensions, kit and deployments (ADRs 0021, 0027): an extension module is named
  # by the kit and by a deployment, and a plugin extension by another plugin extension too.
  # Core names no extension; each extension names core alone (grit.slack's rule above says
  # it for Slack), but a plugin extension may name plugin extensions, since a plugin that
  # reads another takes it in its constructor; which plugin is Mill's moduleDeps' job. The
  # kit names no plugin, since a deployment hands it plugins as values, and no edge
  # extension, no terminal UI and no deployment, since an edge reaches it as a ServedEdge
  # value. Mill's
  # moduleDeps already keep each of these off the classpath; the rules are the record of the
  # intent, and the guard if a moduleDeps entry is ever added. grit.eval's cases name
  # grit.core alone (its integration sources, the assembly eval, are unruled);
  # grit.eval.harness names core, the models extension, the kit's .env loader and those
  # cases alone.
  # -------------------------------------------------------------------------------------
  - id: core-names-no-extension
    allow: core-modules
    only: [core-modules]
    via: imports
    mode: strict
    because: "ADR 0021: core is what the thesis fails without; naming an extension would make every deployment carry it"

  - id: models-names-core-alone
    allow: models-code
    only: [core-modules, models-code]
    via: imports
    mode: strict
    because: "ADR 0021: a shipped extension implements core's traits and names no other extension"

  - id: host-names-core-alone
    allow: host-code
    only: [core-modules, host-code]
    via: imports
    mode: strict
    because: "ADR 0021: a shipped extension implements core's traits and names no other extension"

  - id: tools-names-core-alone
    allow: tools-code
    only: [core-modules, tools-code]
    via: imports
    mode: strict
    because: "ADR 0021: a shipped extension implements core's traits and names no other extension"

  - id: plugins-name-core-and-plugins
    allow: plugin-extensions
    only: [core-modules, plugin-extensions]
    via: imports
    mode: strict
    because: "ADRs 0021, 0027: a plugin implements core's Plugin and reads another plugin only through the service it exports; naming the kit, an edge extension or a deployment would tie it to one way of running"

  - id: mcp-names-core-alone
    allow: mcp-code
    only: [core-modules, mcp-code]
    via: imports
    mode: strict
    because: "ADR 0021: a shipped extension implements core's traits and names no other extension"

  - id: mcp-generic-names-no-github
    allow: mcp-generic
    only: [core-modules, mcp-generic]
    via: imports
    mode: strict
    because: "extensions/mcp/README.md: grit.mcp's protocol, client, scope and edge serve any MCP server; GitHub's bounds are grit.mcp.github, which a deployment names and they never do"

  - id: tui-names-core-alone
    allow: tui-code
    only: [core-modules, tui-code]
    via: imports
    mode: strict
    because: "ADR 0021: the terminal UI is an extension a cloud deployment never loads; it names core alone"

  - id: kit-names-no-edge-or-deployment
    allow: kit-code
    only: [core-modules, models-code, tools-code, host-code, kit-code]
    via: imports
    mode: strict
    because: "ADRs 0021, 0027: a plugin reaches the kit as a Plugin value and an edge as a ServedEdge value, a cloud deployment never loads the terminal UI, and the kit names no deployment"

  - id: eval-names-core-alone
    allow: eval-code
    only: [core-code, eval-code]
    via: imports
    mode: strict
    because: "the eval's cases are hand-written conversations and how they are laid out in a database, over core's traits; the harness builds its synthetic reference from them, so naming more would reach the harness through them"

  - id: harness-names-core-and-models
    allow: harness-code
    only: [core-modules, models-code, kit-environment, eval-code, harness-code]
    via: imports
    mode: strict
    because: "the eval harness measures what grit ships through its own code paths (eval/harness/README.md); naming the kit's wiring, an edge or a deployment would measure one deployment's wiring instead; the kit's .env loader is how a run reads its key, as grit.app does; the eval's cases are its synthetic reference"
