# The law, in enola's intent vocabulary. enola discovers this file beside the walk config
# in mcp-arch.yaml.
#
# CLAUDE.md and STYLE.md are the authority; this file is enforcement. Right now it carries
# exactly ONE rule -- the half of STYLE rule 8 that can be checked -- deliberately. The
# full set of layers and rules is a separate planning session. A minimal file that is
# verified to bite beats a large one nobody has watched fail.
#
# Selectors are finalized AGAINST THE SNAPSHOT, not guessed. enola names a dependency fact
# by its SOURCE DIRECTORY and its exact imported symbol:
#   "grit/interop/src -> dev.dbos.transact.DBOS"   (file: grit/interop/src/Main.scala)
# so the four DBOS imports in this repo are four distinct target names.
#
# There is NO prefix form for a target. Probed 2026-09-23 on 0.4.15: `forbid_name`
# accepts only an exact name, `prefix*` or `*suffix` ("* -> dev.dbos.*" is rejected by
# lint), and a component's `where: {import: "dev.dbos*"}` compares exactly -- a planted
# DBOS import in core left it at 0 members and the gate at exit 0. One rule per symbol.

service:
  name: grit
  description: LLM coding harness whose prompt is a computed projection over Postgres

# Declared layer order, outermost first.
#
# TRAP: layer paths are SERVICE-relative; component `match` paths below are REPO-relative.
# Two different bases in one file. The service root here is the `grit/` directory, so the
# module enola records as `grit/core/src` is named `core/src` to a layer -- and every
# repo-rooted form (`grit/**`, `grit/core/src`, `grit/tui/**`) resolves to ZERO modules.
# Discovered by probing, because a layer matching nothing is not an error: `constraints
# lint` prints "matches nothing; no import can violate this layer" and still exits 0, so
# the layer silently takes part in no verdict. This is why scripts/enola-law.sh greps for
# that string instead of trusting the exit code.
#
# TRAP: enola's module model is DIRECTORY-grained -- a layer naming individual FILES also
# resolves to zero modules. Only directories classify.
#
# The order is linear but the graph is not: `tui` and `interop` both sit on `core` and must
# not name each other. At this grain that is Mill's job -- neither module has the other in
# its moduleDeps, so it is a compile error -- and these layers are documentation. Inside a
# module Mill sees nothing, which is where layers and forbid rules start to carry weight.
#
# Test modules (*/test/**) are deliberately unclassified. Layers are a ratchet graded
# against a baseline, so they are NOT in the gate script yet; see scripts/enola-law.sh.
layers:
  - {name: tui,     paths: ["tui/src", "tui/src/**"]}
  - {name: interop, paths: ["interop/src", "interop/src/**"]}
  - {name: core,    paths: ["core/src", "core/src/**"]}

# Every module outside the quarantine. For core and tui this DUPLICATES a compile error --
# neither has transact on its classpath -- and is kept for the module that it does not
# duplicate: `app` depends on interop, Mill's moduleDeps are transitive, so app WILL have
# dev.dbos.* on its classpath and this rule is the only thing stopping it. Add
# "grit/app/**" here when that directory exists (a glob matching no file is noise today).
#
# A subtree glob, not an exact file list: the list existed only because interop was a
# package inside core and the selector has no exclusion form. Verified: 24 members, and a
# planted `import dev.dbos.transact.DBOS` in core/src/Entry.scala fails the gate, exit 1.
components:
  - name: outside-interop
    kind: dependency
    match: ["grit/core/**", "grit/tui/**"]

rules:
  - id: only-interop-imports-dbos-core
    forbid_name: outside-interop
    pattern: "* -> dev.dbos.transact.DBOS"
    mode: strict
    because: "STYLE rule 8: dev.dbos.* is quarantined to grit.interop"

  - id: only-interop-imports-dbos-options
    forbid_name: outside-interop
    pattern: "* -> dev.dbos.transact.StartWorkflowOptions"
    mode: strict
    because: "STYLE rule 8: dev.dbos.* is quarantined to grit.interop"

  - id: only-interop-imports-dbos-config
    forbid_name: outside-interop
    pattern: "* -> dev.dbos.transact.config.DBOSConfig"
    mode: strict
    because: "STYLE rule 8: dev.dbos.* is quarantined to grit.interop"

  - id: only-interop-imports-dbos-txstep
    forbid_name: outside-interop
    pattern: "* -> dev.dbos.transact.txstep.JdbcStepFactory"
    mode: strict
    because: "STYLE rule 8: dev.dbos.* is quarantined to grit.interop"
