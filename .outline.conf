# Sources no query shows unless it names them fully.
hide dev/outline/fixture

# Main sources a short name rarely means: the eval harness and the dev tools. A short name with one
# candidate outside these and test sources resolves to it, and a note names the others.
secondary eval/harness/
secondary dev/

