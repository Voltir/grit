version = "3.8.3"
runner.dialect = scala3

maxColumn = 100

# Braces, always. Significant indentation is a compile error (-no-indent);
# scalafmt must never reintroduce it or strip the braces back out.
rewrite.scala3.convertToNewSyntax = false
rewrite.scala3.removeOptionalBraces = no

align.preset = none
docstrings.style = SpaceAsterisk
docstrings.wrap = no
