version = "3.11.5"
runner.dialect = scala3

# Capture checking is on project-wide, so every seam signature carries `^`
# (`(using Tx^)`, `(Tx^) ?=> A`, `Connection^{tx}`). The stock scala3 dialect
# rejects all of it; this override is what makes those files formattable.
# Needs scalameta >= 4.13 — scalafmt 3.8.3 fails with NoSuchMethodException.
runner.dialectOverride.allowCaptureChecking = true

maxColumn = 100

# Braces, always. Significant indentation is a compile error (-no-indent);
# scalafmt must never reintroduce it or strip the braces back out.
rewrite.scala3.convertToNewSyntax = false
rewrite.scala3.removeOptionalBraces = no

align.preset = none
docstrings.style = SpaceAsterisk
docstrings.wrap = no

# Imports in one mechanical order: java, then scala, then grit, then everything else,
# each group sorted. Nobody decides where an import goes.
rewrite.rules = [Imports]
rewrite.imports.sort = ascii
rewrite.imports.groups = [
  ["java\\..*", "javax\\..*"],
  ["scala\\..*"],
  ["grit\\..*"]
]
