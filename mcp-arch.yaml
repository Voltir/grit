# enola's walk config: which paths it reads when it maps this repository.
# Trimmed from the upstream default (github.com/enola-labs/enola/mcp-arch.yaml), which
# carries rules for a dozen ecosystems this repo does not use.
#
# TRAP: `ignore` REPLACES enola's built-in list rather than extending it. Anything left
# out of this file is indexed, so a deletion here is a decision, not a tidy-up. (Since 0.4.29
# enola also skips its own `.claude/rules/enola.md` whatever this list says.)
#
# scripts/enola-law.sh's greps read the Scala sources git tracks or would track, so a path
# this list indexes must not be gitignored: .gitignore and this list must agree.
#
# TRUST BOUNDARY -- read before writing any rule against this snapshot.
# Import-edge and module facts may gate; symbol facts (symbol counts, exported-surface,
# complexity outliers, `enola impact`'s graph) never do. grit compiles with capture checking
# project-wide, and up to enola 0.4.24 the Scala extractor dropped and mis-nested symbols under
# capture syntax while reporting `parse_errors: 0` (on a controlled fixture: 40 symbols from
# capture-annotated sources against 46 from structurally identical plain ones). 0.4.29
# extracts all 46 with their right owners, but its receipt would be as silent about a new
# regression, and the fixture covers no separation-checking syntax. So symbol facts may guide
# exploration, and a symbol-level claim is confirmed against the compiler's view (outline)
# before it is stated.
repo: "."

ignore:
  # Version control and enola's own output.
  - "**/.git/**"
  - ".git/**"
  - "**/.enola/**"
  - ".enola/**"

  # Build output and editor/BSP state. `out/` alone is ~150MB of mill output; indexing
  # it would count every compiled source a second time. Mill uses out/, NOT target/ --
  # an sbt-style **/target/** glob matches nothing here.
  - "**/out/**"
  - "out/**"
  - "**/.bsp/**"
  - ".bsp/**"
  - "**/.metals/**"
  - ".metals/**"
  - "**/.bloop/**"
  - ".bloop/**"
  - "**/.mill*/**"
  - ".mill*/**"

  # Vendored prior art, read for reference and never shipped: pi, dbos4s, the papers.
  # Indexed, it would dominate every count with code that is not ours.
  - ".local/**"

  # Agents' git worktrees (Claude Code's `isolation: worktree`): whole copies of grit on
  # other branches. Indexed, every import in them resolves to the copy and breaks the law.
  - ".claude/worktrees/**"

  # Capture probes (a module's probes/src): test sources, which no rule governs, declaring
  # main packages. enola resolves an import to the first directory declaring its package,
  # and `probes` sorts before `src`, so indexed, a main source's imports would land in them.
  # Still needed on 0.4.29: indexed, a renamed import (`Label as VisibilityLabel`) resolves
  # into core's probes and the law reports two false breaches.
  - "**/probes/**"

  # Working documents this checkout keeps out of git. They yield no intent (every intent fact
  # comes from enola-intent.yaml), only heading symbols that moved the snapshot on every edit,
  # and a baseline pinned here would differ from one pinned in a clean clone.
  - "roadmap/**"
  - "CLAUDE.local.md"

  # The enola binary itself (51MB, extensionless). Excluded by kind anyway; named here
  # so the census stays legible.
  - "tools/**"

# Deliberately NOT ignored, against the upstream default:
#   *.md   -- the mdintent extractor reads markdown for stated intent. grit's markdown states
#             none in its form today (every intent fact comes from enola-intent.yaml), so this
#             only keeps the extractor's input in place for when it does.
#   mill, docker-compose.yml -- excluded by kind regardless; leaving them in the walk
#             shows the census really covered the whole tree.
#
# extractors: / explainers: / renderers: are deliberately ABSENT. Each key REPLACES the
# built-in list, so a file that mirrors today's default can only fall behind it as new
# ones ship. The scala and mdintent extractors must stay enabled.

output:
  dir: ".enola"
